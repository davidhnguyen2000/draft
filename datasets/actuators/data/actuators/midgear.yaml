    notes: 'FAULHABER''s integrated robotics drive: a 21-pole-pair iron-core internal
      rotor, a low-backlash planetary gearhead (2 stages in 1, needle bearings) and a
      15-bit SSI absolute encoder in one 100 x 34 mm housing, L/D 0.34. THREE CAVEATS,
      all material. (1) NO ONBOARD DRIVER. Unlike every other row in this population
      the BXI ships without control electronics and is paired with an external
      FAULHABER MC5010 motion controller, so 987 g is not the same quantity the rest
      of the catalogue reports. (2) THE PUBLISHED NUMBERS ARE AT DIFFERENT VOLTAGES.
      Max. torque 20 N.m, max. power output 270 W and max. phase current 13 A are all
      "up to" figures over a 0-50 V motor range, while the 114 min-1 no-load speed is
      explicitly stated at 24 V. The 114 min-1 is recorded because it is the only
      speed FAULHABER publishes, but it is a HALF-VOLTAGE number and the row is
      therefore speed-pessimistic: against the fitted speed trend it lands at 0.47x
      predicted for a 10.5:1 reduction, and scaling it to the 50 V ceiling puts it
      within 1% of the trend. (3) Consequently the tau*w/4 envelope mixes voltages and
      returns 60 W against the 270 W FAULHABER publishes as mechanical output — a
      4.5x gap, where the one other published-power row in the catalogue (MIT Mini
      Cheetah U8) differs from its envelope by 1.47x. P_peak_W is left null so the
      row stays on the envelope rule; flip it to 270 only together with a 50 V speed.
