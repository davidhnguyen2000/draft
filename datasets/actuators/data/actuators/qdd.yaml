    notes: 6:1, 96x40mm, 40 rad/s @24V; continuous torque 6.9 Nm. The ONLY row where branch 1 of the peak-power rule fires - Katz publishes +250/-680 W mechanical, and -680 W is the REGENERATIVE limit, so 250 W is the figure; the tau*w/4 envelope would say 170 W. Thesis states "Output Inertia", hence the output kind on the rotor block. Mass is NOT in the thesis actuator table - source still open.
    checked: '2026-08-26'

