      unit: g.mm2
      kind: rotor
      source: zeroerr.com eRob 70T, Strain Wave Gear input side inertia
    notes: 'SHG 14 gearset, 100 W. ZeroErr''s page confirms 1.24 kg and phi73 x 99. Its torque table is the same one eRob70H has - max momentary 46/61/70/70 N.m at 50/80/100/120 - so the 70 N.m this row carried is the 100:1 (or 120:1) figure and is now paired with that ratio''s 30 rpm instead of 50:1''s 60 rpm. Input inertia 50996 gmm2 is eRob70H''s with-brake value: the T is the same drivetrain in a heavier housing.'
