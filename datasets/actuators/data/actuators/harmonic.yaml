# Harmonic actuators — 19 rows
#
# Strain-wave gearing, 50:1 and up.
#
# One row = one catalogued part, and everything known about it lives HERE —
# there is no second table to keep in step. See README.md (this directory)
# for the field reference.
#
# Required: name, vendor, tau_peak_Nm, mass_kg, and exactly one of
# no_load_rpm / omega_NL_rad_s. Everything else may be null.

actuators:
  - name: eRob 80F
    vendor: ZeroErr
    source: https://www.zeroerr.com/rotary_actuators/erob80f
    tau_peak_Nm: 71
    mass_kg: 0.89
    no_load_rpm: 30
    P_peak_W: null        # vendor-published MECHANICAL peak; null -> tau*w/4
    gear: 100
    OD_mm: 80
    L_mm: 57.5
    rotor_inertia:
      value: 29818
      unit: g.mm2
      kind: rotor
      source: zeroerr.com eRob 80F, Strain Wave Gear input side inertia
    notes: SHD 17 gearset. ZeroErr's own product page confirms max torque 71 N.m, 0.89 kg and phi80 x 57.5 exactly as this row had them - it is absent from manual V3.36, not from the catalogue. Ratios offered are 50 and 100; the 71 N.m is the 100:1 figure, so gear and speed are paired at 100:1 / 30 rpm rather than the 60 rpm that belongs to 50:1. Input-side inertia 29818 gmm2. Motor power 126 W.
    checked: '2026-08-27'

  - name: eRob 70T
    vendor: ZeroErr
    source: https://www.zeroerr.com/rotary_actuators/erob70t
