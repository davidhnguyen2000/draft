[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "draft-robots"
version = "0.1.0"
description = "Draft — a parametric design tool for robot exploration"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "David Nguyen" },
    { name = "Marcelo Coelho" },
    { name = "Sangbae Kim" },
]
keywords = ["robotics", "mjcf", "mujoco", "design", "actuators", "co-design"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

# The generator: parameter table + tree -> MJCF, checked against the trends.
dependencies = [
    "mujoco>=3.2",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "trimesh>=4.0",
    # Not in trimesh's base install but required: earcut triangulates root-body
    # cross-sections, rtree is used for mesh inertia properties.
    "mapbox-earcut>=1.0",
    "rtree>=1.0",
    "scipy>=1.10",
]

[project.optional-dependencies]
# The browser editor (optional so headless jobs skip the 3D viewer).
editor = ["viser>=0.2", "websockets>=12.0"]
# Rebuilding the four twins. `robot_descriptions` fetches vendor models
# (scripts/setup_data.py); `pin` (Pinocchio) measures mass matrix and gravity.
twins = [
    "robot_descriptions",
    "matplotlib>=3.7",
    "pin>=2.7",
    # H2's URDF uses COLLADA meshes; without this H2 drops out of Table III.
    "pycollada>=0.7",
]
# Redrawing the paper's figures (IEEE style; mjviser for rendered plates).
figures = ["matplotlib>=3.7", "scienceplots>=2.1", "viser>=0.2", "mjviser"]
# Training a generated design (GPU). Pinned to the versions the paper's §V
# policies were trained with; newer rsl-rl-lib and wandb are incompatible.
rl = [
    "mjlab==1.4.0",
    "mujoco==3.8.0",
    "mujoco-warp==3.8.1",
    "warp-lang==1.12.1",
    "rsl-rl-lib==5.2.0",
    "torch==2.12.0",
    "wandb==0.27.0",
]
# Refitting the trends from the raw catalogues under datasets/.
datasets = ["matplotlib>=3.7", "robot_descriptions", "pin>=2.7"]
dev = ["pytest>=7.0"]

# No console entry points: everything a user runs is a script under `scripts/`.

[tool.setuptools.packages.find]
where = ["src"]
include = ["draft*"]

[tool.setuptools.package-data]
# The fitted trends ship with the code.
"draft.trends" = ["data/*.json"]
# A robot is its parameter table, tree, and any mesh spec.
"draft.robots" = ["**/*.yaml", "**/*.xml"]
"draft.editor" = ["web/static/*"]
"draft.tasks"  = ["*.yaml", "**/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
